controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 5.0 # Keep low (5.0) for allowing tiago to rotate properly
    min_x_velocity_threshold: 0.05 # era 0.001
    min_y_velocity_threshold: 0.05 # era 0.001
    min_theta_velocity_threshold: 0.1 # era 0.01
    failure_tolerance: 5.0
    progress_checker_plugin: "progress_checker"
    current_goal_checker: "general_goal_checker" # ADDED BY US
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: /mobile_base_controller/odom

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 30.0
    # Goal checker parameters
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25      # Before was 0.3
      yaw_goal_tolerance: 0.25    # Before was 6.28
      stateful: True
    # DWB parameters
    FollowPath:    
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      # 2. Define which controller the shim should "wrap"
      primary_controller: "dwb_core::DWBLocalPlanner"
      
      # 3. Shim-specific parameters
      angular_dist_threshold: 0.2 # 45 degrees (Trigger rotation if error is larger than this)
      forward_sampling_distance: 0.4 # Look 0.5m ahead on the path to find the target heading
      rotate_to_heading_angular_vel: 1.0 # How fast to rotate in place
      max_angular_accel: 1.5
      simulate_ahead_time: 0.5 # Check for collisions while rotating

      
      debug_trajectory_details: True

      min_vel_x: 0.0   
      max_vel_x: 1.0
      min_vel_theta: 0.2
      max_vel_theta: 0.5
      

      min_speed_xy: 0.0
      max_speed_xy: 1.00
      min_speed_theta: 0.2

      acc_lim_x: 2.0      # Was 2.5
      acc_lim_theta: 0.5  # Was 3.2s
      decel_lim_x: -2.0   # Was -2.5
      decel_lim_theta: -0.5 # Was -3.2

      vx_samples: 20
      vtheta_samples: 40 # 20

      sim_time: 2.0 # 2.0
      
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.20      # before was 0.25
      trans_stopped_velocity: 0.25
      #rot_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True

      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

      BaseObstacle.scale: 2.0 # determines how "steep" the cost increase is near obstacles

      PathDist.scale: 24.0 #32.0 weights penalty to global path distance
      PathAlign.scale: 0.0 #32 how closely the robot heading stays parallel to the path
      PathAlign.forward_point_distance: 0.1 # specifies the robot lookahead distance along the path


      GoalDist.scale: 1.0 # 24.0 weights penalty to goal distance
      GoalAlign.scale: 70.0 # 24.0 How much it should orient towards the goal if small it cares about local orientaation
      GoalAlign.forward_point_distance: 0.0 #  0.1 lookahead distance to evaluate goal alignment

      
      RotateToGoal.scale: 1.0 # 24.0 forces the robot to face towards the goal
      RotateToGoal.slowing_factor: 10.0 # deceleration factor when approaching goal
      RotateToGoal.lookahead_time: -1.0 #predict where the robot will be in time

     
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      always_send_full_costmap: False
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      robot_radius: 0.3
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: true
        scan:
          topic: /scan_raw
          max_obstacle_height: 2.0
          min_obstacle_height: 0.1 # ADDED BY US
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0 # INCREASED FROM 0.0 to filter reflections
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0 # INCREASED FROM 0.0 to filter reflections
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor:  2.0 # lower values = "steeper" inflation
        inflation_radius: 0.65 #0.55
      always_send_full_costmap: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.3 #0.275
      
      # CHANGE 1: Use obstacle_layer instead of voxel_layer for 2D TIAGo
      plugins: ["obstacle_layer", "inflation_layer"]
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor:  2.0 # lower values = "steeper" inflation
        inflation_radius: 0.65 #0.55
      # CHANGE 2: Configure ObstacleLayer correctly
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_raw
          max_obstacle_height: 2.0
          min_obstacle_height: 0.1  # Set to 0.0 so we don't accidentally filter valid hits
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: true
          raytrace_max_range: 3.5 # 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0 # 2.0
          obstacle_min_range: 0.0 
               
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    use_sim_time: true
